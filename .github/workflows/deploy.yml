name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folders
        run: |
          mkdir -p _site/2025AHCKP
          cp 2025AHCKP/index.html _site/2025AHCKP/index.html
          for s in literature impact welfare action change meaning speaker; do
            mkdir -p "_site/2025AHCKP/$s"
            cp 2025AHCKP/index.html "_site/2025AHCKP/$s/index.html"
          done
          if [ -d 2025AHCKP/files ]; then cp -r 2025AHCKP/files _site/2025AHCKP/files; fi
          if [ -d 2025AHCKP/report ]; then cp -r 2025AHCKP/report _site/2025AHCKP/report; fi
          cp index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
